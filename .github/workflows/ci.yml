name: Linksy CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Verify Go Backend
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Install Frontend Dependencies & Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Go Binary
        run: |
          go build -v -o bin/linksy cmd/api/main.go

      - name: Deploy to Render via API
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.RENDER_API_KEY != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Triggering deployment on Render for srv-dbejv15g1s2s73frgh90..."
          curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/srv-dbejv15g1s2s73frgh90/deploys
