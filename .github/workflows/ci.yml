name: Linksy CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lynqr
          POSTGRES_PASSWORD: lynqr
          POSTGRES_DB: lynqr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lynqr" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Verify Go Backend (SQLite)
        run: |
          go vet ./...
          go test -race ./...

      - name: Verify Go Backend (PostgreSQL 16)
        env:
          LYNQR_TEST_POSTGRES_URL: postgres://lynqr:lynqr@localhost:5432/lynqr_test?sslmode=disable
        run: go test -race ./test/... ./internal/service/...

      - name: Install Frontend Dependencies, Test & Build SPA
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Build Go Binary
        run: |
          go build -v -o bin/linksy cmd/api/main.go

      - name: Provision WorkOS Resources
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.WORKOS_API_KEY != ''
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          APP_URL: "https://test.lynqr.app"
        run: |
          chmod +x scripts/provision_workos.sh
          ./scripts/provision_workos.sh

      - name: Deploy to Render via API
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.RENDER_API_KEY != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Triggering deployment on Render for test (srv-dbejv15g1s2s73frgh90) and production (srv-dbf6qa8m7kps73fvogf0)..."
          curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/srv-dbejv15g1s2s73frgh90/deploys
          curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/srv-dbf6qa8m7kps73fvogf0/deploys
