name: Linksy CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Verify Go Backend
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Install Frontend Dependencies & Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Go Binary
        run: |
          go build -v -o bin/linksy cmd/api/main.go

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
