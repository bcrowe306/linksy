services:
  - type: web
    name: lynqr-test
    runtime: go
    plan: free
    region: oregon
    buildCommand: "make build"
    startCommand: "./bin/linksy"
    envVars:
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: linksy-db
          property: internalConnectionString
      - key: STORAGE_TYPE
        value: r2
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: lynqr-storage
      - key: APP_URL
        value: https://test.lynqr.app
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_REDIRECT_URI
        value: https://test.lynqr.app/api/v1/auth/callback

databases:
  - name: linksy-db
    plan: free
    region: oregon
    databaseName: linksy_db
    user: linksy_db_user
