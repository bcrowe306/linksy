services:
  - type: web
    name: linksy-app
    runtime: go
    plan: starter
    region: oregon
    buildCommand: "cd web && npm install && npm run build && cd .. && go build -o bin/linksy cmd/api/main.go"
    startCommand: "./bin/linksy"
    envVars:
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: linksy-postgres
          property: connectionString
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_PATH
        value: /var/data/uploads
      - key: APP_URL
        value: https://linksy-app.onrender.com
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
    disk:
      name: linksy-storage
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: linksy-postgres
    plan: starter
    region: oregon
    databaseName: linksy
    user: linksy_user
